name: Build INTUBE APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Fix google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {"project_number": "123456789","project_id": "intube-dummy","storage_bucket": "dummy.appspot.com"},
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abcdef123456",
                "android_client_info": {"package_name": "com.aistudio.intube.kyrnnor"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDummyKey1234567890"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          EOF

      - name: Build APK without gradlew
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INTUBE-Premium-APK
          path: app/build/outputs/apk/debug/app-debug.apk
        
